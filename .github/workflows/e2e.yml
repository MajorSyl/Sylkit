name: e2e
on:
  push:
    branches: [sylkit-2]
    paths: ['scripts/ci/e2e_run.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ci-commit, cancel-in-progress: false }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: sylkit-2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund > .ci-npm.txt 2>&1; echo "npm exit $?" >> .ci-npm.txt
        continue-on-error: true
      - name: Type check
        continue-on-error: true
        run: npx tsc --noEmit > .ci-tsc.txt 2>&1; echo "tsc exit $?" >> .ci-tsc.txt
      - name: Worker tests
        continue-on-error: true
        run: for t in worker/test/*.mjs; do node --no-warnings $t || echo "FAILED $t"; done > .ci-unit.txt 2>&1
      - name: Web build
        continue-on-error: true
        run: npx expo export --platform web > .ci-build.txt 2>&1; echo "build exit $?" >> .ci-build.txt
      - name: Wait for the preview to run this commit
        run: |
          sleep 300
          for i in $(seq 1 40); do
            s=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' -d '{}' https://sylkit-2-sylkit.fannah2026.workers.dev/api/order/cancel)
            [ "$s" = "400" ] && echo "preview ready" && break; sleep 20; done
          sleep 30
      - run: npm i --no-save playwright@1 > .ci-pw.txt 2>&1; npx playwright install --with-deps chromium >> .ci-pw.txt 2>&1; echo "pw exit $?" >> .ci-pw.txt
        continue-on-error: true
      - name: Hydration probe (development build)
        continue-on-error: true
        run: npx expo export --platform web --dev --output-dir dist-dev > .ci-devbuild.txt 2>&1; node scripts/ci/hydration.mjs dist-dev >> .ci-devbuild.txt 2>&1; echo "probe exit $?" >> .ci-devbuild.txt
      - run: node scripts/ci/e2e.mjs > .ci-e2e.txt 2>&1 || true
        continue-on-error: true
      - if: always()
        run: |
          mkdir -p .ci/e2e && for f in .ci-npm.txt .ci-pw.txt; do tail -c 4000 $f > .ci/e2e/$f 2>/dev/null; done; tail -c 6000 .ci-devbuild.txt > .ci/e2e/.ci-devbuild.txt 2>/dev/null; tail -c 6000 .ci-build.txt > .ci/e2e/.ci-build.txt; cp .ci-tsc.txt .ci-unit.txt .ci-e2e.txt .ci/e2e/ 2>/dev/null; tail -c 20000 .ci/e2e/.ci-build.txt > /dev/null || true
          git config user.name "sylkit-ci"; git config user.email "ci@sylkit.com"
          git add -f .ci/e2e && git commit -m "ci: end-to-end test results" || exit 0
          git pull --rebase origin sylkit-2 && git push
