name: net-probe
on:
  push:
    branches: [sylkit-2]
    paths: ['.github/workflows/net-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: sylkit-2 }
      - run: |
          mkdir -p .ci
          curl -s "https://sylkit.com/api/photos/search?q=gym%20weights&per=3&orientation=landscape" > .ci/probe.json
          google-chrome --version >> .ci/probe.txt || true
          git config user.name "sylkit-ci"; git config user.email "ci@sylkit.com"
          git add .ci && git commit -m "ci: probe" && git push
