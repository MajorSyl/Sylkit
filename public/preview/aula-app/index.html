let history=[];
root.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close]'); if(!b) return;
  const d=b.dataset;
  if(d.close!==undefined && e.target===b){S.sheet=false;return render()}
  if(d.lang){lang=d.lang;return render()}
  if(d.go){history=[];return go(d.go,{tab:d.go==='home'?'home':S.tab})}
  if(d.tab){history=[];return go(d.tab,{tab:d.tab})}
  if(d.cat){S.cat=d.cat;return render()}
  if(d.course){history.push(S.screen);return go('course',{course:d.course,time:null})}
  if(d.chat){history.push(S.screen);return go('chat',{chat:d.chat})}
  if(d.back!==undefined){return go(history.pop()||S.tab)}
  if(d.fav){S.fav.has(d.fav)?S.fav.delete(d.fav):S.fav.add(d.fav);return render()}
  if(d.sheet!==undefined){S.sheet=true;return render()}
  if(d.time){S.time=+d.time;return render()}
  if(d.book!==undefined&&S.time!=null){S.sheet=false;S.toast=L(T.booked);render();setTimeout(()=>{if(S.toast){S.toast='';render()}},3200)}
});
root.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='login'||f==='signup') return go('home',{tab:'home'});
  if(f==='chat'){const v=e.target.querySelector('input').value.trim();if(!v)return;(S.chatLog[S.chat]=S.chatLog[S.chat]||[]).push(v);render();const i=document.querySelector('.compose input');if(i)i.focus();const sc=document.querySelector('.screen');if(sc)sc.scrollTop=sc.scrollHeight}
});
root.addEventListener('input',e=>{
  if(e.target.matches('[data-filter]')){const q=e.target.value.toLowerCase();document.querySelectorAll('#list [data-q]').forEach(r=>r.style.display=r.dataset.q.includes(q)?'':'none')}
});
// Gallery thumbnails open straight on the home screen.
const start=qs.get('screen'); if(start&&V[start]&&start!=='course'&&start!=='chat'){S.screen=start;S.tab=['home','explore','messages','profile'].includes(start)?start:'home'}
render();
})();
