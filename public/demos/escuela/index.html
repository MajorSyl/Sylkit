<!doctype html>
<html lang="es" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="google" content="notranslate">
<title>Demo · Gestión escolar · Sylkit</title><meta name="description" content="Prueba en vivo el sistema de gestión escolar de Sylkit: estudiantes, notas, asistencia, mensualidades y portal para padres.">
<link rel="stylesheet" href="/_kit/kit.css"></head><body>
<script src="/_kit/kit.js"></script>
<script>
const SUBJ = { es: ['Matemáticas', 'Lengua', 'Ciencias', 'Historia', 'Inglés'], en: ['Math', 'Language', 'Science', 'History', 'English'] };
SylDemo.create({
  id: 'escuela', version: 1, theme: {"headerDark": true, "bg": "#FFF9E8", "card": "#ffffff", "primary": "#2563EB", "primaryD": "#1D4ED8", "soft": "#DBEAFE", "accent": "#FBBF24", "hbg": "#2563EB", "hfg": "#ffffff", "font": "'Nunito',sans-serif", "head": "'Fredoka',sans-serif", "fonts": "family=Nunito:wght@400;600;700;800&family=Fredoka:wght@400;600;700;800", "r": "16px", "rLg": "24px"},
  product: 'gestion-escolar', logo: "🎒", color: '#1D6BFF',
  name: { es: 'Gestión escolar', en: 'School Management' }, brand: { es: "Colegio Los Próceres", en: "Los Próceres School" },
  sub: { es: "Primaria · Año escolar 2026–2027", en: "Primary · 2026–2027 school year" },
  t: {
    es: { tStudents: 'Estudiantes', tGrades: 'Notas', tAttend: 'Asistencia', tFees: 'Mensualidades', tParents: 'Portal de padres',
      stTitle: 'Estudiantes', stSub: 'Todos los alumnos por grado, con su representante y estado de pago.', grade: 'Grado', parent: 'Representante', avg: 'Promedio', newSt: 'Inscribir estudiante', name: 'Nombre completo', phone: 'WhatsApp del representante', enrolled: 'Estudiante inscrito.',
      grTitle: 'Carga de notas', grSub: 'El docente escribe las notas (escala 1–20) y el sistema calcula promedios y boletas.', subject: 'Materia', saveGrades: 'Guardar notas', gSaved: 'Notas guardadas. Los padres ya pueden verlas.',
      atTitle: 'Asistencia de hoy', atSub: 'Toca para marcar presente, ausente o retardo. Los padres de los ausentes reciben un aviso.', present: 'Presente', absent: 'Ausente', late: 'Retardo', saveAtt: 'Guardar asistencia', attSaved: (n) => `Asistencia guardada. ${n} aviso(s) enviado(s) a representantes.`,
      feTitle: 'Mensualidades', feSub: 'Quién pagó y quién debe este mes. Envía recordatorios por WhatsApp con un toque.', paid: 'Pagado', pending: 'Pendiente', overdue: 'Vencido', remind: 'Recordar', markPaid: 'Registrar pago', reminded: (n) => `Recordatorio enviado al representante de ${n}.`, feePaid: 'Pago registrado.',
      sCollected: 'Cobrado este mes', sPending: 'Por cobrar', sRate: 'Al día', fee: 'Mensualidad',
      paTitle: 'Portal de padres', paSub: 'Lo que ve el representante desde su teléfono: notas, asistencia y pagos de su hijo.', child: 'Estudiante', report: 'Boleta', attendance: 'Asistencia', balance: 'Pagos', allPaid: 'Al día ✓', owes: 'Mensualidad pendiente' },
    en: { tStudents: 'Students', tGrades: 'Grades', tAttend: 'Attendance', tFees: 'Fees', tParents: 'Parent portal',
      stTitle: 'Students', stSub: 'Every student by grade, with their guardian and payment status.', grade: 'Grade', parent: 'Guardian', avg: 'Average', newSt: 'Enroll student', name: 'Full name', phone: 'Guardian WhatsApp', enrolled: 'Student enrolled.',
      grTitle: 'Enter grades', grSub: 'Teachers enter grades (1–20 scale) and the system calculates averages and report cards.', subject: 'Subject', saveGrades: 'Save grades', gSaved: 'Grades saved. Parents can see them now.',
      atTitle: "Today's attendance", atSub: 'Tap to mark present, absent or late. Parents of absent students get a notice.', present: 'Present', absent: 'Absent', late: 'Late', saveAtt: 'Save attendance', attSaved: (n) => `Attendance saved. ${n} notice(s) sent to guardians.`,
      feTitle: 'Monthly fees', feSub: 'Who paid and who owes this month. Send WhatsApp reminders with one tap.', paid: 'Paid', pending: 'Pending', overdue: 'Overdue', remind: 'Remind', markPaid: 'Record payment', reminded: (n) => `Reminder sent to ${n}'s guardian.`, feePaid: 'Payment recorded.',
      sCollected: 'Collected this month', sPending: 'Outstanding', sRate: 'Up to date', fee: 'Monthly fee',
      paTitle: 'Parent portal', paSub: 'What guardians see on their phone: their child\'s grades, attendance and payments.', child: 'Student', report: 'Report card', attendance: 'Attendance', balance: 'Payments', allPaid: 'Up to date ✓', owes: 'Fee pending' },
  },
  seed: (a) => {
    const N = ['Ana Martínez', 'Benjamín Rojas', 'Camila Pérez', 'Daniel Gómez', 'Elena Castillo', 'Fabián Torres', 'Gabriela Núñez', 'Héctor Ramos', 'Isabel Mora', 'Javier Soto', 'Karla Vega', 'Leonardo Ruiz'];
    const P = ['Sra. Martínez', 'Sr. Rojas', 'Sra. Pérez', 'Sr. Gómez', 'Sra. Castillo', 'Sr. Torres', 'Sra. Núñez', 'Sr. Ramos', 'Sra. Mora', 'Sr. Soto', 'Sra. Vega', 'Sr. Ruiz'];
    const students = N.map((name, i) => ({ id: 's' + i, name, grade: ['3er', '4to', '5to'][i % 3], parent: P[i], phone: '+58 416 20' + (10000 + i * 377), fee: i % 4 === 1 ? 'pending' : i % 5 === 2 ? 'overdue' : 'paid',
      grades: SUBJ.es.map((_, k) => 11 + ((i * 7 + k * 5) % 9)), att: { p: 38 + (i % 4), a: i % 3, l: i % 2 } }));
    return { students, gradeF: '4to', subj: 0, today: {}, fee: 45 };
  },
  tabs: [
    { id: 'students', icon: "👧", label: 'tStudents', render: (a) => {
        const d = a.db, u = a.ui;
        const avg = (s) => (s.grades.reduce((x, y) => x + y, 0) / s.grades.length).toFixed(1);
        return `<h1 class="k-h1">${a.t('stTitle')}</h1><p class="k-sub">${a.t('stSub')}</p>${u.chips(['3er', '4to', '5to'].map((g) => [g, `${g} ${a.t('grade')}`]), d.gradeF, 'gradeF')}
          ${u.card('', d.students.filter((s) => s.grade === d.gradeF).map((s) => u.row({ avatar: u.initials(s.name), color: u.avatarColor(s.name), title: s.name, meta: `${a.t('parent')}: ${s.parent} · ${s.phone}`, right: u.pill(`${a.t('avg')} ${avg(s)}`, avg(s) >= 15 ? 'green' : avg(s) >= 12 ? 'blue' : 'orange') + u.pill(a.t(s.fee), s.fee === 'paid' ? 'green' : s.fee === 'pending' ? 'orange' : 'red') })).join(''), u.btn('+ ' + a.t('newSt'), 'newSt', {}, 'p sm'))}`;
      } },
    { id: 'grades', icon: "📝", label: 'tGrades', render: (a) => {
        const d = a.db, u = a.ui, list = d.students.filter((s) => s.grade === d.gradeF);
        return `<h1 class="k-h1">${a.t('grTitle')}</h1><p class="k-sub">${a.t('grSub')}</p>${u.chips(['3er', '4to', '5to'].map((g) => [g, `${g} ${a.t('grade')}`]), d.gradeF, 'gradeF')}${u.chips(SUBJ[a.lang].map((s, i) => [String(i), s]), String(d.subj), 'subj')}
          ${u.card('', list.map((s) => u.row({ avatar: u.initials(s.name), color: u.avatarColor(s.name), title: s.name, right: `<input class="k-input" type="number" min="1" max="20" inputmode="numeric" data-g="${s.id}" value="${s.grades[d.subj]}" style="width:80px;text-align:center;font-weight:800">` })).join('')
            + `<div class="k-total big"><span>${a.t('avg')}</span><span>${(list.reduce((x, s) => x + s.grades[d.subj], 0) / Math.max(1, list.length)).toFixed(1)}</span></div><button class="k-btn p block" data-act="saveGrades">${a.t('saveGrades')}</button>`)}`;
      } },
    { id: 'attend', icon: "✅", label: 'tAttend', render: (a) => {
        const d = a.db, u = a.ui, list = d.students.filter((s) => s.grade === d.gradeF), C = { p: 'green', a: 'red', l: 'orange' }, L = { p: a.t('present'), a: a.t('absent'), l: a.t('late') };
        return `<h1 class="k-h1">${a.t('atTitle')}</h1><p class="k-sub">${a.t('atSub')}</p>${u.chips(['3er', '4to', '5to'].map((g) => [g, `${g} ${a.t('grade')}`]), d.gradeF, 'gradeF')}
          ${u.card(a.date(a.addDays(0), { weekday: 'long', day: 'numeric', month: 'long' }), list.map((s) => { const v = d.today[s.id] || 'p'; return u.row({ avatar: u.initials(s.name), color: u.avatarColor(s.name), title: s.name, right: ['p', 'l', 'a'].map((k) => `<button class="k-btn sm ${v === k ? 'p' : 'g'}" data-act="mark" data-id="${s.id}" data-v="${k}" style="${v === k && k !== 'p' ? `background:var(--${C[k]})` : ''}">${L[k]}</button>`).join('') }); }).join('') + `<button class="k-btn p block" data-act="saveAtt" style="margin-top:10px">${a.t('saveAtt')}</button>`)}`;
      } },
    { id: 'fees', icon: "💳", label: 'tFees', badge: (a) => a.db.students.filter((s) => s.fee !== 'paid').length, render: (a) => {
        const d = a.db, u = a.ui, paid = d.students.filter((s) => s.fee === 'paid').length;
        return `<h1 class="k-h1">${a.t('feTitle')}</h1><p class="k-sub">${a.t('feSub')}</p>${u.stats([{ label: a.t('sCollected'), value: a.money(paid * d.fee), color: 'var(--green)' }, { label: a.t('sPending'), value: a.money((d.students.length - paid) * d.fee), color: 'var(--orange)' }, { label: a.t('sRate'), value: Math.round((paid / d.students.length) * 100) + '%' }])}
          ${u.card(`${a.t('fee')}: ${a.money(d.fee)}`, d.students.slice().sort((x, y) => (x.fee === 'paid') - (y.fee === 'paid')).map((s) => u.row({ avatar: u.initials(s.name), color: u.avatarColor(s.name), title: s.name, meta: `${s.grade} · ${s.parent}`, right: u.pill(a.t(s.fee), s.fee === 'paid' ? 'green' : s.fee === 'pending' ? 'orange' : 'red') + (s.fee !== 'paid' ? u.btn('📲 ' + a.t('remind'), 'remind', { id: s.id }, 'wa sm') + u.btn(a.t('markPaid'), 'pay', { id: s.id }, 's sm') : '') })).join(''))}`;
      } },
    { id: 'parents', icon: "👨‍👩‍👧", label: 'tParents', render: (a) => {
        const d = a.db, u = a.ui, s = d.students[1], subj = SUBJ[a.lang];
        return `<h1 class="k-h1">${a.t('paTitle')}</h1><p class="k-sub">${a.t('paSub')}</p><div style="max-width:480px">${u.card(`${a.t('child')}: ${s.name} · ${s.grade}`, `<h3 style="font-size:15px;margin:4px 0 6px">${a.t('report')}</h3>${subj.map((n, i) => `<div class="k-total"><span>${n}</span><b style="color:${s.grades[i] >= 15 ? 'var(--green)' : s.grades[i] >= 10 ? 'var(--text)' : 'var(--red)'}">${s.grades[i]}/20</b></div>`).join('')}
          <div class="k-total big"><span>${a.t('avg')}</span><span>${(s.grades.reduce((x, y) => x + y, 0) / s.grades.length).toFixed(1)}</span></div>
          <h3 style="font-size:15px;margin:14px 0 6px">${a.t('attendance')}</h3><div class="k-total"><span>${a.t('present')}</span><b>${s.att.p}</b></div><div class="k-total"><span>${a.t('absent')}</span><b>${s.att.a}</b></div><div class="k-total"><span>${a.t('late')}</span><b>${s.att.l}</b></div>
          <h3 style="font-size:15px;margin:14px 0 6px">${a.t('balance')}</h3>${s.fee === 'paid' ? u.pill(a.t('allPaid'), 'green') : u.pill(`${a.t('owes')}: ${a.money(d.fee)}`, 'orange')}`)}</div>`;
      } },
  ],
  actions: {
    gradeF: (a, d) => { a.db.gradeF = d.v; a.db.today = {}; a.rerender(); }, subj: (a, d) => { a.db.subj = +d.v; a.rerender(); },
    saveGrades: (a) => { document.querySelectorAll('[data-g]').forEach((el) => { const s = a.db.students.find((x) => x.id === el.dataset.g); s.grades[a.db.subj] = Math.max(1, Math.min(20, +el.value || 1)); }); a.save(); a.toast(a.t('gSaved')); a.rerender(); },
    mark: (a, d) => { a.db.today[d.id] = d.v; a.rerender(); },
    saveAtt: (a) => { let n = 0; a.db.students.filter((s) => s.grade === a.db.gradeF).forEach((s) => { const v = a.db.today[s.id] || 'p'; s.att[v]++; if (v === 'a') n++; }); a.db.today = {}; a.save(); a.toast(a.t('attSaved', n)); a.rerender(); },
    remind: (a, d) => a.toast(a.t('reminded', a.db.students.find((s) => s.id === d.id).name)),
    pay: (a, d) => { a.db.students.find((s) => s.id === d.id).fee = 'paid'; a.save(); a.toast(a.t('feePaid')); a.rerender(); },
    newSt: (a) => a.modal({ title: a.t('newSt'), submit: a.t('save'), fields: [{ name: 'name', label: a.t('name'), required: true }, { name: 'grade', label: a.t('grade'), type: 'select', value: a.db.gradeF, options: ['3er', '4to', '5to'].map((g) => [g, g]) }, { name: 'parent', label: a.t('parent'), required: true }, { name: 'phone', label: a.t('phone') }],
      onSubmit: (v) => { a.db.students.push({ id: a.uid(), ...v, fee: 'pending', grades: [15, 15, 15, 15, 15], att: { p: 0, a: 0, l: 0 } }); a.db.gradeF = v.grade; a.save(); a.toast(a.t('enrolled')); a.rerender(); } }),
  },
});
</script>
</body></html>
